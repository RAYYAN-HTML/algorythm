name: Qt 6 CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows Qt 6 ${{ matrix.build_type }} build and tests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTING=ON

      - name: Build application and tests
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Run CTest
        shell: pwsh
        run: |
          ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::group::Direct C++ test diagnostics"
            $testOutputPath = Join-Path $env:RUNNER_TEMP 'algorithm-test-diagnostics.txt'
            $diagnosticArguments = @('-o', "$testOutputPath,junitxml")
            & .\build\AlgorythmAlgorithmTests.exe @diagnosticArguments
            if (Test-Path $testOutputPath) { Get-Content $testOutputPath }
            Write-Host "::endgroup::"
            exit 1
          }

      - name: Run QML lint
        shell: pwsh
        run: |
          $qmlFiles = Get-ChildItem qml -Recurse -Filter *.qml | ForEach-Object FullName
          $qmlTests = Get-ChildItem tests -Filter tst_*.qml | ForEach-Object FullName
          qmllint -I build @qmlFiles @qmlTests
