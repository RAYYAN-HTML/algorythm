name: Bug report
description: Report a reproducible issue in Algorythm
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior you observed.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open …\n2. Select …\n3. Observe …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Algorythm version or commit
  - type: input
    id: environment
    attributes:
      label: OS, display resolution, and Qt version (if known)
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility details
      description: Include keyboard, screen-reader, contrast, or reduced-motion details when relevant.
      required: false
